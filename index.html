<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Weather App</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      color: #fff;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      overflow: hidden;
      position: relative;
    }

    #canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 10;
    }

    .app {
      background: rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(20px);
      padding: 40px;
      border-radius: 25px;
      text-align: center;
      width: 350px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      border: 1px solid rgba(255, 255, 255, 0.2);
      animation: slideIn 0.6s ease-out;
    }

    @keyframes slideIn {
      from {
        transform: translateY(-30px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    h2 {
      font-size: 2.5em;
      margin-bottom: 30px;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
      animation: fadeIn 0.8s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
      }
      to {
        opacity: 1;
      }
    }

    .search-box {
      display: flex;
      gap: 10px;
      margin-bottom: 25px;
      animation: slideUp 0.6s ease-out 0.1s both;
    }

    @keyframes slideUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }
      to {
        transform: translateY(0);
        opacity: 1;
      }
    }

    input {
      padding: 12px 15px;
      width: 70%;
      border: 2px solid rgba(255, 255, 255, 0.3);
      border-radius: 10px;
      outline: none;
      background: rgba(255, 255, 255, 0.2);
      color: #fff;
      font-size: 1em;
      transition: all 0.3s ease;
    }

    input::placeholder {
      color: rgba(255, 255, 255, 0.7);
    }

    input:focus {
      background: rgba(255, 255, 255, 0.3);
      border-color: rgba(255, 255, 255, 0.6);
      box-shadow: 0 0 15px rgba(255, 255, 255, 0.2);
    }

    button {
      padding: 12px 25px;
      border: none;
      border-radius: 10px;
      background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
      color: #fff;
      cursor: pointer;
      font-weight: bold;
      font-size: 1em;
      transition: all 0.3s ease;
      box-shadow: 0 4px 15px rgba(245, 87, 108, 0.4);
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(245, 87, 108, 0.6);
    }

    button:active {
      transform: translateY(0);
    }

    .weather {
      margin-top: 25px;
      min-height: 150px;
      animation: slideUp 0.6s ease-out 0.2s both;
    }

    .weather-content {
      animation: fadeIn 0.5s ease-out;
    }

    .city-name {
      font-size: 1.8em;
      margin-bottom: 15px;
      font-weight: bold;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
    }

    .weather-icon {
      font-size: 4em;
      margin: 15px 0;
      animation: float 3s ease-in-out infinite;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0px);
      }
      50% {
        transform: translateY(-10px);
      }
    }

    .temp {
      font-size: 3em;
      font-weight: bold;
      margin: 15px 0;
      text-shadow: 0 3px 10px rgba(0, 0, 0, 0.3);
    }

    .description {
      font-size: 1.2em;
      margin: 10px 0;
      text-transform: capitalize;
      color: rgba(255, 255, 255, 0.9);
    }

    .details {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      margin-top: 20px;
      font-size: 0.95em;
    }

    .detail-box {
      background: rgba(255, 255, 255, 0.1);
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.2);
      transition: all 0.3s ease;
    }

    .detail-box:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }

    .detail-label {
      font-size: 0.85em;
      opacity: 0.8;
      margin-bottom: 5px;
    }

    .detail-value {
      font-size: 1.3em;
      font-weight: bold;
    }

    .error {
      color: #ff6b6b;
      font-size: 1.1em;
      animation: shake 0.5s ease-in-out;
    }

    .error-hint {
      color: rgba(255, 200, 87, 0.9);
      font-size: 0.9em;
      margin-top: 10px;
      opacity: 0.8;
      line-height: 1.6;
    }

    .error-hint code {
      background: rgba(255, 255, 255, 0.2);
      padding: 2px 6px;
      border-radius: 3px;
      font-family: 'Courier New', monospace;
      font-size: 0.85em;
    }

    .last-update {
      font-size: 0.85em;
      margin-top: 20px;
      opacity: 0.7;
      padding-top: 15px;
      border-top: 1px solid rgba(255, 255, 255, 0.2);
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      25% { transform: translateX(-5px); }
      75% { transform: translateX(5px); }
    }

    .loading {
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border-top-color: #fff;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  
  <div class="container">
    <div class="app">
      <h2>🌦️ Weather App</h2>
      <p style="font-size: 0.9em; opacity: 0.8; margin-bottom: 15px;">Live Hyderabad Weather</p>
      <div class="search-box">
        <input type="text" id="city" placeholder="(Backend: Hyderabad only)" readonly>
        <button onclick="getWeather()">Refresh</button>
      </div>

      <div class="weather" id="weather"></div>
    </div>
  </div>

  <script>
    // Canvas Animation
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');
    
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    window.addEventListener('resize', () => {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    });

    class Particle {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.size = Math.random() * 3 + 1;
        this.speedX = (Math.random() - 0.5) * 2;
        this.speedY = Math.random() * 2 + 1;
        this.opacity = Math.random() * 0.5 + 0.3;
      }

      update() {
        this.x += this.speedX;
        this.y += this.speedY;
        this.opacity -= 0.01;
      }

      draw() {
        ctx.fillStyle = `rgba(255, 255, 255, ${this.opacity})`;
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    let particles = [];

    function createParticles() {
      for (let i = 0; i < 3; i++) {
        particles.push(
          new Particle(
            Math.random() * canvas.width,
            Math.random() * canvas.height * 0.5
          )
        );
      }
    }

    function animateBackground() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      
      // Draw animated circles
      for (let i = 0; i < 5; i++) {
        const time = Date.now() * 0.0001 + i * 1.256;
        const x = Math.sin(time) * 100 + canvas.width / 2;
        const y = Math.cos(time * 0.7) * 100 + canvas.height / 2;
        
        ctx.fillStyle = `rgba(255, 255, 255, ${0.05 + Math.sin(time) * 0.02})`;
        ctx.beginPath();
        ctx.arc(x, y, 100 + Math.sin(time * 2) * 50, 0, Math.PI * 2);
        ctx.fill();
      }

      // Update and draw particles
      particles = particles.filter(p => p.opacity > 0);
      particles.forEach(p => {
        p.update();
        p.draw();
      });

      if (Math.random() < 0.3) {
        createParticles();
      }

      requestAnimationFrame(animateBackground);
    }

    animateBackground();

    // Backend Configuration
    const BACKEND_URL = "http://localhost:8080";
    let autoRefreshInterval = null;

    function getWeatherIcon(description) {
      const desc = description.toLowerCase();
      if (desc.includes('rain')) return '🌧️';
      if (desc.includes('cloud')) return '☁️';
      if (desc.includes('clear') || desc.includes('sunny')) return '☀️';
      if (desc.includes('snow')) return '❄️';
      if (desc.includes('thunder')) return '⛈️';
      if (desc.includes('wind')) return '💨';
      if (desc.includes('fog') || desc.includes('mist')) return '🌫️';
      return '🌤️';
    }

    async function getWeatherFromBackend() {
      const weatherDiv = document.getElementById("weather");
      weatherDiv.innerHTML = '<div class="loading"></div>';

      try {
        const response = await fetch(`${BACKEND_URL}/weather`);
        
        if (!response.ok) {
          throw new Error("Backend connection failed");
        }

        const data = await response.json();
        
        if (data.error) {
          throw new Error(data.error);
        }

        const icon = getWeatherIcon(data.icon);
        const lastUpdate = new Date().toLocaleTimeString();

        weatherDiv.innerHTML = `
          <div class="weather-content">
            <div class="city-name">📍 ${data.city}, ${data.country}</div>
            <div class="weather-icon">${icon}</div>
            <div class="temp">${Math.round(data.temperature)}°C</div>
            <div class="description">${data.description}</div>
            <div class="details">
              <div class="detail-box">
                <div class="detail-label">💧 Humidity</div>
                <div class="detail-value">${data.humidity}%</div>
              </div>
              <div class="detail-box">
                <div class="detail-label">💨 Wind Speed</div>
                <div class="detail-value">${data.windSpeed} m/s</div>
              </div>
              <div class="detail-box">
                <div class="detail-label">🌡️ Feels Like</div>
                <div class="detail-value">${Math.round(data.feelsLike)}°C</div>
              </div>
              <div class="detail-box">
                <div class="detail-label">🔽 Pressure</div>
                <div class="detail-value">${data.pressure} hPa</div>
              </div>
              <div class="detail-box">
                <div class="detail-label">👁️ Visibility</div>
                <div class="detail-value">${data.visibility.toFixed(1)} km</div>
              </div>
              <div class="detail-box">
                <div class="detail-label">☁️ Cloudiness</div>
                <div class="detail-value">${data.cloudiness}%</div>
              </div>
            </div>
            <div class="last-update">🔄 Updated: ${lastUpdate}</div>
          </div>
        `;
      } catch (error) {
        weatherDiv.innerHTML = `
          <p class="error">❌ ${error.message}</p>
          <p class="error-hint">
            📍 C++ Backend not running!<br>
            ✅ Start it with: <code>backend/weather_server.exe</code><br>
            💡 Using FREE Open-Meteo API (no API key needed!)
          </p>
        `;
        console.error("Error:", error);
      }
    }

    async function getWeather() {
      const city = document.getElementById("city").value;
      
      if (city && city.toLowerCase() !== 'hyderabad') {
        // For other cities, show a message
        const weatherDiv = document.getElementById("weather");
        weatherDiv.innerHTML = '<p class="error">⚠️ Backend only supports Hyderabad. Search ignored.</p>';
        return;
      }
      
      getWeatherFromBackend();
    }

    // Auto-refresh weather every 5 minutes
    function startAutoRefresh() {
      getWeatherFromBackend();
      autoRefreshInterval = setInterval(getWeatherFromBackend, 300000);
    }

    // Load weather on page load
    window.addEventListener('load', startAutoRefresh);
    
    // Allow Enter key to search
    document.getElementById("city").addEventListener('keypress', function(event) {
      if (event.key === 'Enter') {
        getWeather();
      }
    });
  </script>
</body>
</html>
